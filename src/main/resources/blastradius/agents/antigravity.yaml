# Profile: Google Antigravity.
# The Antigravity CLI and IDE approval cards.
name: antigravity
description: Antigravity IDE card and CLI approval prompts (verified from live IDE session)
reader: screen
status: partial
notes:
  - "IDE card title format: 'Allow <tool description>?' e.g. 'Allow run git status to test permission prompt?'"
  - "Option 1: 'Yes, allow this time'"
  - "Option 2: 'Yes, and always allow <command> in this conversation'"
  - "Option 3: 'Yes, and always allow <command>'"
  - "Option 4: 'No (tell the agent what to do instead)'"
  - "Buttons: Skip, Submit"

prompts:
# Sandbox bypass is listed first so it wins when sandbox bypass is requested
- id: sandbox-bypass
  type: privilege_escalation
  verified: true
  detect: '(?i)Allow\s+sandbox\s+bypass\b'
  target:
    - '(?s)(?i)always allow\s*[''"`](?<target>.+?)[''"`]'
    - '(?m)^\s*\$\s+(?<target>\S.*?)\s*$'

- id: ide-approval-card
  type: shell_command
  verified: true
  detect: '(?i)(?:Allow\s+(?:run\s+)?[^?\n]*\?|Do\s+you\s+want\s+to\s+proceed\?|Run\s+command\?)'
  target:
    - '(?s)(?i)\?\s*\n\s*(?<target>(?:git|rm|Remove-Item|Stop-Process|Set-|iex|iwr|curl|cat|dir|ls|mvn|npm|cargo|node|python)[^\n]*?(?:\n[^\n]+?)*?)\s*\n\s*1\s*Yes'
    - '(?s)(?i)always allow\s*[''"`](?<target>.+?)[''"`]'
    - '(?s)(?i)always allow\s+(?<target>.+?)\s+in this conversation'
    - '(?s)commands that start with\s*[''"`](?<target>.+?)[''"`]'
    - '(?s)(?i)\?\s*\n\s*(?<target>[^\n]+(?:\n[^\n]+)*?)\s*\n\s*1\s*Yes'
    - '(?m)^\s*\$\s+(?<target>\S.*?)\s*$'

- id: proceed
  type: shell_command
  verified: true
  detect: '(?i)Do\s+you\s+want\s+to\s+proceed\?'
  target:
    - '(?s)(?i)always allow\s*[''"`](?<target>.+?)[''"`]'
    - '(?s)commands that start with\s*[''"`](?<target>.+?)[''"`]'
    - '(?m)^\s*\$\s+(?<target>\S.*?)\s*$'

prompt_gone:
  - '(?i)\b(?:You approved|You denied|You declined|You canceled)\b'

log:
  verified: false
  paths: []
